<div #rulerContainer
  class="glass-bg-effect h-[32px] !pl-4 p-2 overflow-x-hidden w-full sticky top-0 z-10 rounded-3xl backdrop-blur-[7.5px]">
  <div class="relative h-full" [style.width.px]="timelineWidth">
    <!-- Major ticks with labels (every second) -->
    <ng-container *ngFor="let tick of timeRulerTicks">
      <!-- Major tick line (every 10 seconds) or minor tick (every 2 seconds) -->
      <div class="absolute top-0 flex items-center" [style.left.px]="tick * pixelsPerSecond">
        <div *ngIf="isMajorTick(tick)" class="w-1 h-4 bg-white rounded-b-2xl"></div>
        <div *ngIf="!isMajorTick(tick)" class="w-px h-2 bg-white/30 rounded-b-2xl"></div>
        <!-- Label for major ticks -->
        <span *ngIf="isMajorTick(tick)" class="text-[10px] font-semibold text-white/90 ml-1">
          {{ formatTimeRuler(tick) }}
        </span>
      </div>
    </ng-container>
  </div>
</div>
