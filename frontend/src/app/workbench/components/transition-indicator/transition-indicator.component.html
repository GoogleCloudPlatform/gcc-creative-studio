<div class="transition-indicator-container absolute z-40 flex items-center justify-center cursor-pointer"
  [style.left.px]="left" style="width: 24px; height: 24px; top: calc(50% - 12px);"
  (mousedown)="$event.stopPropagation()" (click)="$event.stopPropagation(); openModal()">
  <div
    class="transition-icon-wrapper flex items-center justify-center bg-zinc-800 rounded-md w-5 h-5 shadow-lg text-white transition-colors"
    [class.active-transition]="hasActiveTransition">
    <mat-icon class="!w-3 !h-3 !text-[12px] flex items-center justify-center">{{ transitionIcon }}</mat-icon>
  </div>
</div>

<!-- Modal/Dialog Template -->
<ng-template #transitionModal>
  <div class="bg-[#18181b] border border-white/10 rounded-xl p-6 text-white max-w-sm">
    <h4 class="!text-base !font-bold !mb-4 flex items-center gap-2">
      <mat-icon class="!w-5 !h-5 flex items-center justify-center !mb-[0.2rem]">{{ transitionIcon }}</mat-icon>
      Edit Transition
    </h4>
    <div class="space-y-3 mb-6 text-white/70">
      <p class="text-sm">Configure transition settings here.</p>
      <div class="bg-black/20 rounded-lg p-4 text-xs space-y-4 font-mono">
        <div class="space-y-1.5">
          <div class="text-[10px] text-white/50 uppercase font-bold tracking-wider mb-4">Transition Type:</div>
          <div class="grid grid-cols-2 gap-2">
            <div *ngFor="let opt of transitionOptions" (click)="selectType(opt.type)"
              class="flex items-center gap-2 p-2 rounded-lg border bg-[#1c1c1f] transition-all hover:bg-zinc-800 cursor-pointer"
              [ngClass]="{
                'border-white/30 bg-blue-500/10 ring-2 ring-blue-500/20 text-white': opt.type === selectedType,
                'border-white/5 text-white/60': opt.type !== selectedType
              }">
              <mat-icon class="!w-4 !h-4 !text-[16px] flex items-center justify-center">{{ opt.icon }}</mat-icon>
              <span class="text-xs font-semibold select-none">{{ opt.label }}</span>
            </div>
          </div>
        </div>

        <div class="space-y-1 !mt-6">
          <div class="text-[10px] text-white/50 uppercase font-bold tracking-wider">Duration (s):</div>
          <div class="flex items-center gap-3">
            <studio-slider [min]="0" [max]="4" [step]="0.1" [(ngModel)]="durationSeconds"
              class="flex-grow w-full"></studio-slider>
            <input type="number" step="0.1" min="0" max="4" [(ngModel)]="durationSeconds"
              class="bg-zinc-800 border border-white/10 rounded px-2 py-1 text-white w-14 outline-none focus:border-blue-500 font-mono text-xs no-spinners" />
          </div>
        </div>
      </div>
    </div>
    <div class="flex justify-end gap-3">
      <button mat-button mat-dialog-close class="!text-white/60 !rounded-lg">Cancel</button>
      <button mat-button mat-dialog-close [disabled]="isSaveDisabled" (click)="saveTransition()"
        class="!text-blue-400 !rounded-lg">Save</button>
    </div>
  </div>
</ng-template>
