<div
  class="folder-card"
  [class.selected]="isSelected"
  [class.drag-over]="isDragOver"
  [class.is-dragging]="isDragging"
  [attr.draggable]="!isSelectorMode"
  (dragstart)="onDragStart($event)"
  (dragend)="onDragEnd($event)"
  (dragover)="onDragOver($event)"
  (dragenter)="onDragOver($event)"
  (dragleave)="onDragLeave($event)"
  (drop)="onDrop($event)"
  (click)="onCardClick($event)"
>
  <div class="folder-content">
    <div
      class="folder-icon-wrapper"
      [style.color]="folderColor"
    >
      <mat-icon>{{ isDragOver ? 'folder_open' : 'folder' }}</mat-icon>
    </div>

    <div class="folder-text">
      <div class="folder-name truncate" [title]="folderName">
        {{ folderName }}
      </div>
      <div class="folder-count">
        {{ totalCount }} item{{ totalCount === 1 ? '' : 's' }}
      </div>
    </div>
  </div>

  <div class="folder-options" (click)="onMenuClick($event)">
    <button
      mat-icon-button
      [matMenuTriggerFor]="menu"
      aria-label="Folder actions menu"
      class="folder-menu-button"
      #menuTrigger="matMenuTrigger"
    >
      <mat-icon>more_vert</mat-icon>
    </button>
    <mat-menu #menu="matMenu" xPosition="before" yPosition="below" class="folder-mat-menu">
      <button mat-menu-item (click)="onEdit($event)">
        <mat-icon>edit</mat-icon>
        <span>Edit</span>
      </button>
      <button mat-menu-item (click)="onCopy($event)">
        <mat-icon>content_copy</mat-icon>
        <span>Copy</span>
      </button>
      <button mat-menu-item (click)="onMove($event)">
        <mat-icon>drive_file_move</mat-icon>
        <span>Move</span>
      </button>
      <mat-divider></mat-divider>
      <button mat-menu-item (click)="onDelete($event)">
        <mat-icon color="warn">delete</mat-icon>
        <span class="text-red-400">Delete</span>
      </button>
    </mat-menu>
  </div>
</div>
