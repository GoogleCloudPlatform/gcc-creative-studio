<div class="folder-dialog-container glass-morphism">
  <div class="dialog-header">
    <div class="flex items-center gap-3">
      <div class="folder-icon-badge" [style.background-color]="selectedColor + '33'" [style.color]="selectedColor">
        <mat-icon>folder</mat-icon>
      </div>
      <div>
        <h2 class="dialog-title">{{ isEditMode ? 'Rename Folder' : 'New Folder' }}</h2>
        <p class="dialog-subtitle">
          {{ isEditMode ? 'Update folder name and badge color' : 'Create a folder to organize your media and assets' }}
        </p>
      </div>
    </div>
  </div>

  <div class="dialog-content">
    <div class="form-group mb-6">
      <label class="form-label">Folder Name</label>
      <input
        type="text"
        class="folder-input"
        [class.has-error]="isDuplicateName"
        placeholder="e.g. Summer Campaign 2026"
        [(ngModel)]="folderName"
        (keyup.enter)="isValid && save()"
        autofocus
      />
      <span *ngIf="isDuplicateName" class="error-message">
        A folder with this name already exists in this location.
      </span>
    </div>

    <div class="form-group">
      <label class="form-label">Color Badge</label>
      <div class="color-picker-grid">
        <button
          type="button"
          *ngFor="let color of colorOptions"
          class="color-dot"
          [style.background-color]="color"
          [class.selected]="selectedColor === color"
          (click)="selectedColor = color"
        >
          <mat-icon *ngIf="selectedColor === color">check</mat-icon>
        </button>
      </div>
    </div>
  </div>

  <div class="dialog-footer">
    <studio-button variant="primary" size="medium" (click)="close()">
      Cancel
    </studio-button>
    <studio-button
      variant="primary"
      size="medium"
      [disabled]="!isValid"
      (click)="save()"
    >
      {{ isEditMode ? 'Save Changes' : 'Create Folder' }}
    </studio-button>
  </div>
</div>
