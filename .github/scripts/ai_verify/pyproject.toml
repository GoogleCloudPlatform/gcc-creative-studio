[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-verify"
version = "0.1.0"
description = "Multi-step dual-model AI PR verification pipeline for Creative Studio"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=1.52.0,<2.0.0",
    "anthropic[vertex]>=0.49.0,<1.0.0",
    "google-auth>=2.35.0,<3.0.0",
]

[project.scripts]
ai-verify = "ai_verify.cli:main"

[dependency-groups]
prep = [
    "bandit>=1.8.0,<2.0.0",
    "pytest>=8.4.1,<10.0.0",
    "pytest-cov>=6.0.0,<8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_verify"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.black]
line-length = 80
