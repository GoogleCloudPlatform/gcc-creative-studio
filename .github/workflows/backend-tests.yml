name: Backend Quality

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - main
      - develop
      - test
    paths:
      - 'backend/**'

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: creative_studio
          POSTGRES_USER: studio_user
          POSTGRES_PASSWORD: studio_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PROJECT_ID: 'dummy-project-id'
      ENVIRONMENT: 'local'
      DATABASE_URL: 'postgresql+asyncpg://studio_user:studio_password@localhost:5432/creative_studio'
      DB_HOST: 'localhost'
      DB_PORT: '5432'
      DB_USER: 'studio_user'
      DB_PASSWORD: 'studio_password'
      DB_NAME: 'creative_studio'
      USE_CLOUD_SQL_AUTH_PROXY: 'false'
      isLocal: 'True'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Set up uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        cache-dependency-glob: "backend/uv.lock"

    - name: Install dependencies
      run: |
        cd backend
        uv sync --all-extras

    - name: Run Black Formatter Check
      run: |
        cd backend
        uv run black --check src tests

    - name: Run Pylint
      run: |
        cd backend
        uvx pylint --rcfile=pylintrc --fail-under=9.0 src tests

    - name: Run database migrations
      run: |
        cd backend
        uv run alembic upgrade head

    - name: Run tests
      run: |
        cd backend
        uv run pytest tests -v --cov=src --cov-fail-under=80

