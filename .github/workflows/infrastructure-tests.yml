name: Infrastructure Quality & Bootstrap Tests

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - main
      - develop
      - test
    paths:
      - 'bootstrap.sh'
      - 'infrastructure/**'

jobs:
  test-bootstrap:
    name: Run Offline Bootstrap Unit Tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Run automated offline bootstrapper test suite
      run: |
        chmod +x infrastructure/tests/test_bootstrap_offline.sh
        bash infrastructure/tests/test_bootstrap_offline.sh
