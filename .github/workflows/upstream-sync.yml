name: Upstream Sync

on:
  schedule:
    - cron: '0 6 * * *'      # Daily at 06:00 UTC (11:30 IST)
  workflow_dispatch:          # Manual "Run workflow" button

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork (full history)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream + fetch
        run: |
          git remote add upstream https://github.com/GoogleCloudPlatform/gcc-creative-studio.git || true
          git fetch upstream main

      - name: Update upstream-sync branch to mirror upstream/main
        run: |
          git branch -f upstream-sync upstream/main
          git push origin upstream-sync --force

      - name: Check how far main is behind upstream
        id: check
        run: |
          BEHIND=$(git rev-list --count main..upstream/main)
          echo "behind=$BEHIND" >> "$GITHUB_OUTPUT"
          echo "main is $BEHIND commit(s) behind upstream/main"

      - name: Report sync status
        if: steps.check.outputs.behind != '0'
        run: |
          echo "::notice title=Upstream Sync::${{ steps.check.outputs.behind }} new upstream commit(s). Open a PR to review: https://github.com/${{ github.repository }}/compare/main...upstream-sync"
          echo ""
          echo "==================================================================="
          echo "  ${{ steps.check.outputs.behind }} new upstream commit(s) available"
          echo "  Review & merge via:"
          echo "  https://github.com/${{ github.repository }}/compare/main...upstream-sync"
          echo "==================================================================="

      - name: Up to date
        if: steps.check.outputs.behind == '0'
        run: echo "✅ Fork is already up to date with upstream."
