name: Frontend Quality

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-quality.yml'
  push:
    branches: [ main, develop ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-quality.yml'

jobs:
  lint:
    name: Lint, Compile & Karma Unit Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install Dependencies
      run: |
        cd frontend
        npm ci

    - name: Run GTS Lint
      run: |
        cd frontend
        npx gts lint

    - name: Run TypeScript Compile Check
      run: |
        cd frontend
        npm run compile

    - name: Run Karma Unit Tests
      run: |
        cd frontend
        CHROME_BIN="${CHROME_BIN:-$(command -v google-chrome-stable || command -v google-chrome || true)}"
        test -n "$CHROME_BIN"
        CHROME_BIN="$CHROME_BIN" npx ng test --watch=false --browsers=ChromeHeadlessCI
